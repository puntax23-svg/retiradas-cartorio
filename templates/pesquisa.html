<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Pesquisa de Retiradas</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        h1{
            margin-bottom: 30px;
        }

        form{
            margin-bottom: 30px;
        }

        input{
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button{
            padding: 12px 20px;
            background: #2952d1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .card{
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        a{
            color: #2952d1;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <h1>PESQUISA DE RETIRADAS</h1>

    <form action="/pesquisa" method="GET">

        <input
            type="text"
            name="termo"
            placeholder="Pesquisar destinatário"
            value="{{ termo }}"
        >

        <button type="submit">
            Pesquisar
        </button>

    </form>

    {% for item in dados %}

    <div class="card">

        <p><b>Destinatário:</b> {{ item[1] }}</p>

        <p><b>Ato:</b> {{ item[2] }}</p>

        <p><b>Retirado por:</b> {{ item[3] }}</p>

        <p><b>Data:</b> {{ item[4] }}</p>

        <p><b>Escrevente:</b> {{ item[5] }}</p>

        {% if item[6] %}

        <p>
            <a href="/uploads/{{ item[6] }}" target="_blank">
                Abrir PDF
            </a>
        </p>

        {% endif %}

    </div>

    {% endfor %}

</body>

</html>
